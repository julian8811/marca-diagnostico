<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar acceso · MarcaCheck 360</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#0f766e;--b2:#14b8a6;--ink:#17211f;--mut:#68726f;--line:#dce5e2;--bg:#f3f7f6;--bad:#c2413b;--ok:#16865b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 50px #17211f14}.brand{font-weight:900;font-size:1.1rem}.mut{color:var(--mut);line-height:1.55}.field{margin-top:14px}.field label{display:block;font-weight:800;font-size:.82rem;margin-bottom:6px}.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px}.primary,.ghost{width:100%;padding:12px;border-radius:12px;font-weight:900;cursor:pointer;margin-top:10px}.primary{border:0;background:linear-gradient(135deg,var(--b),var(--b2));color:#fff}.ghost{border:1px solid var(--line);background:#fff}.msg{min-height:22px;margin-top:10px;font-size:.82rem}.bad{color:var(--bad)}.ok{color:var(--ok)}a{color:var(--b);text-decoration:none;font-weight:800}</style></head><body><main class="card"><div class="brand">MarcaCheck 360</div><h1>Recuperar acceso</h1><div id="requestBox"><p class="mut">Escribe el correo de tu cuenta y enviaremos un enlace para restablecer la contraseña.</p><div class="field"><label>Correo</label><input id="email" class="input" type="email" autocomplete="email"></div><button id="send" class="primary">Enviar enlace</button></div><div id="updateBox" style="display:none"><p class="mut">Define una nueva contraseña para tu cuenta.</p><div class="field"><label>Nueva contraseña</label><input id="password" class="input" type="password" minlength="8" autocomplete="new-password"></div><button id="update" class="primary">Actualizar contraseña</button></div><div id="msg" class="msg"></div><a class="ghost" style="display:block;text-align:center" href="/">Volver a MarcaCheck</a></main><script>const URL='https://fyjvswgqgyvrakluyteq.supabase.co',KEY='sb_publishable_R6Wseju-vULpJt9lIrWl5Q_Zj4sC6yH';const sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'bad')}async function send(){const email=$('email').value.trim();if(!email){msg('Escribe tu correo.');return}const redirectTo=new URL('/recuperar.html',location.origin).href;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});if(error)msg(error.message);else msg('Enlace enviado. Revisa tu correo y sigue las instrucciones.',true)}async function update(){const p=$('password').value;if(p.length<8){msg('La contraseña debe tener al menos 8 caracteres.');return}const {error}=await sb.auth.updateUser({password:p});if(error)msg(error.message);else msg('Contraseña actualizada. Ya puedes volver e iniciar sesión.',true)}$('send').onclick=send;$('update').onclick=update;sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){$('requestBox').style.display='none';$('updateBox').style.display='block';msg('Enlace validado. Define tu nueva contraseña.',true)}});(async()=>{const {data:{session}}=await sb.auth.getSession();if(session&&location.hash){$('requestBox').style.display='none';$('updateBox').style.display='block'}})();</script></body></html>
