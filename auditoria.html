<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoría · MarcaCheck 360</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#0f766e;--ink:#17211f;--mut:#68726f;--line:#dce5e2;--bg:#f3f7f6}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}.top{background:#fff;border-bottom:1px solid var(--line)}.topin,.wrap{max-width:1120px;margin:auto;padding:14px 18px}.topin{display:flex;justify-content:space-between;align-items:center}.nav{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--ink);font-weight:800}.wrap{padding-top:30px;padding-bottom:60px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.mut{color:var(--mut);line-height:1.55}.event{display:grid;grid-template-columns:165px 190px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}.event:last-child{border-bottom:0}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#eef4f2;font-size:.72rem;font-weight:850}.meta{font-family:ui-monospace,SFMono-Regular,monospace;font-size:.73rem;color:var(--mut);white-space:pre-wrap;word-break:break-word}.status{margin-top:12px;color:var(--mut);font-size:.8rem}@media(max-width:750px){.event{grid-template-columns:1fr}.topin{align-items:flex-start}.nav{flex-wrap:wrap}}</style></head><body><header class="top"><div class="topin"><b>MarcaCheck 360 · Auditoría</b><nav class="nav"><a class="btn" href="/">Análisis</a><a class="btn" href="/informes.html">Informes</a></nav></div></header><main class="wrap"><h1>Trazabilidad de actividad</h1><p class="mut">Eventos registrados por el backend para tus búsquedas. El registro es de solo lectura desde el cliente.</p><section class="card"><div id="events"><div class="mut">Cargando…</div></div><div id="status" class="status"></div></section></main><script>const URL='https://fyjvswgqgyvrakluyteq.supabase.co',KEY='sb_publishable_R6Wseju-vULpJt9lIrWl5Q_Zj4sC6yH';const sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/';return}const {data,error}=await sb.from('audit_events').select('id,event_type,source,search_id,report_id,metadata,created_at').order('created_at',{ascending:false}).limit(100);if(error){$('status').textContent=error.message;return}const box=$('events');if(!data?.length){box.innerHTML='<div class="mut">Aún no hay eventos de auditoría.</div>';return}box.innerHTML=data.map(e=>`<div class="event"><div>${new Date(e.created_at).toLocaleString('es-CO')}</div><div><span class="badge">${esc(e.event_type)}</span>${e.source?` <span class="badge">${esc(e.source)}</span>`:''}</div><div><div class="meta">${esc(JSON.stringify(e.metadata||{},null,2))}</div>${e.search_id?`<div class="mut">Búsqueda: ${esc(e.search_id)}</div>`:''}</div></div>`).join('');$('status').textContent=`${data.length} evento(s) recientes.`}load();</script></body></html>
